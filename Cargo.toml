[package]
name = "hexomc-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
zip = "2"
thiserror = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
dirs = "5"
which = "6"
lzma-rs = "0.3"
uuid = { version = "1", features = ["v3", "v4"] }
open = "5"
digest = "0.10"
hex = "0.4"
toml = "0.8"
xml-rs = "0.8"
flate2 = "1"
tar = "0.4"

async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
